        severity:
          green: 0       # shallow groundwater (0 - 2.5 m)
          yellow: 2.5    # seasonal drawdown (2.5 - 3.5 m)
          red: 3.5       # critical dry-season depletion (> 3.5 m) - adjust to your field

      - type: gauge
        entity: sensor.groundwater_gateway_well_2_groundwater_temperature
        name: Groundwater Temp
        unit: °C
        min: 0
        max: 25
        needle: true

      - type: gauge
        entity: sensor.groundwater_gateway_well_2_electrical_conductivity
        name: EC25
        unit: µS/cm
        min: 0
        max: 2000        # the analog EC sensor is only reliable up to about 2000 µS/cm
        needle: true
        severity:
          green: 0
          yellow: 800
          red: 1500      # adjust to the background EC of your groundwater

  - type: entities
    title: Well 2 - telemetry and node health
