# Paste into a Home Assistant dashboard using "Manual card" (YAML editor).
# LITE version: depth, groundwater temperature, EC, air temperature + humidity.
#
# ENTITY IDs: Home Assistant builds them from the device name plus the entity name,
# e.g. sensor.groundwater_gateway_well_1_water_table_depth_below_ground.
# Check the real IDs under Settings > Devices & services > ESPHome > Groundwater Gateway
# and, if they differ, use find-and-replace on the prefix.
#
# The file shows Well 1 and Well 2. For more wells, copy one block and replace the well number.

type: vertical-stack
cards:
  # ---------------------------------------------------------------- Well 1
  - type: markdown
    content: |
      ## North Field Piezometer (Well 1)
      Groundwater level, temperature and conductivity (EC25), plus air temperature and humidity at the well.

  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.groundwater_gateway_well_1_water_table_depth_below_ground
        name: Water Table Depth
        unit: m
        min: 0
        max: 4.5
        needle: true
        severity:
          green: 0       # shallow groundwater (0 - 2.5 m)
          yellow: 2.5    # seasonal drawdown (2.5 - 3.5 m)
          red: 3.5       # critical dry-season depletion (> 3.5 m) - adjust to your field

      - type: gauge
        entity: sensor.groundwater_gateway_well_1_groundwater_temperature
        name: Groundwater Temp
        unit: °C
        min: 0
        max: 25
        needle: true

      - type: gauge
        entity: sensor.groundwater_gateway_well_1_electrical_conductivity
        name: EC25
        unit: µS/cm
        min: 0
        max: 2000        # the analog EC sensor is only reliable up to about 2000 µS/cm
        needle: true
        severity:
          green: 0
          yellow: 800
          red: 1500      # adjust to the background EC of your groundwater

  - type: entities
    title: Well 1 - telemetry and node health
    show_header_toggle: false
    entities:
      - entity: binary_sensor.groundwater_gateway_well_1_node_online
        name: Node online
      - entity: binary_sensor.groundwater_gateway_well_1_water_below_sensor
        name: Water below sensor
      - entity: sensor.groundwater_gateway_well_1_water_column_height
        name: Water column above sensor
        icon: mdi:waves-arrow-up
      - entity: sensor.groundwater_gateway_well_1_air_temperature
        name: Air temperature
        icon: mdi:thermometer
      - entity: sensor.groundwater_gateway_well_1_air_humidity
        name: Air humidity
        icon: mdi:water-percent
      - entity: sensor.groundwater_gateway_well_1_battery_voltage
        name: Node battery (Li-ion)
        icon: mdi:battery-high
      - entity: sensor.groundwater_gateway_well_1_water_table_depth_below_ground
        name: Last LoRa packet
        secondary_info: last-updated
      - entity: number.groundwater_gateway_well_1_sensor_depth_below_ground
        name: Sensor depth below ground (editable)

  - type: history-graph
    title: Well 1 - 7-day depth and EC
    hours_to_show: 168
    entities:
      - entity: sensor.groundwater_gateway_well_1_water_table_depth_below_ground
        name: Depth below ground (m)
      - entity: sensor.groundwater_gateway_well_1_electrical_conductivity
        name: EC25 (µS/cm)

  - type: history-graph
    title: Well 1 - 7-day temperatures
    hours_to_show: 168
    entities:
      - entity: sensor.groundwater_gateway_well_1_groundwater_temperature
        name: Groundwater (°C)
      - entity: sensor.groundwater_gateway_well_1_air_temperature
        name: Air (°C)

  # ---------------------------------------------------------------- Well 2
  - type: markdown
    content: |
      ## South Field Piezometer (Well 2)
      Groundwater level, temperature and conductivity (EC25), plus air temperature and humidity at the well.

  - type: horizontal-stack
